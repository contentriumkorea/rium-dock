<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="335" viewBox="0 0 1200 335" role="img" aria-labelledby="title desc"><title id="title">rium dock 표시 예시</title><desc id="desc">CPU, RAM과 두 계정의 GPT 사용량이 메뉴 막대에 표시되는 구성 도식. 수치는 예시.</desc><rect width="1200" height="335" rx="24" fill="#121822"/><rect x="48" y="76" width="1104" height="80" rx="18" fill="#253040"/><circle cx="91" cy="116" r="7" fill="#93e6d4"/><g fill="#f0f5ff" font-family="-apple-system,Arial,sans-serif" font-weight="600"><g font-size="10"><text x="127" y="103">C</text><text x="127" y="116">P</text><text x="127" y="129">U</text><text x="331" y="103">R</text><text x="331" y="116">A</text><text x="331" y="129">M</text><text x="544" y="103">G</text><text x="544" y="116">P</text><text x="544" y="129">T</text><text x="751" y="103">G</text><text x="751" y="116">P</text><text x="751" y="129">T</text></g><g font-size="30"><text x="144" y="127">24%</text><text x="348" y="127">16G</text><text x="561" y="127">68%</text><text x="768" y="127">11K</text></g></g><text x="51" y="220" fill="#adbbcf" font-family="-apple-system,Arial,sans-serif" font-size="23">한 줄로 보는 시스템 리소스와 계정별 잔여 한도</text><text x="51" y="263" fill="#778ba6" font-family="-apple-system,Arial,sans-serif" font-size="18">설명용 도식 · 표시 수치는 실제 측정값이 아닙니다</text></svg>